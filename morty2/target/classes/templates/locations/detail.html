<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rick & Morty App - Location Detail</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-inverse">
    <div class="container">
        <a class="navbar-brand" href="/">Rick & Morty</a>
        <ul class="nav navbar-nav">
            <li><a href="/characters">Characters</a></li>
            <li><a href="/episodes">Episodes</a></li>
            <li><a href="/locations">Locations</a></li>
        </ul>
    </div>
</nav>


<div class="container" th:fragment="content">
    <h1 th:text="${location.name}"></h1>
    <div class="panel panel-default">
        <div class="panel-body">
            <p><strong>Type:</strong> <span th:text="${location.type}"></span></p>
            <p><strong>Dimension:</strong> <span th:text="${location.dimension}"></span></p>
            <p><strong>Characters:</strong></p>


            <!-- Cambiado de location.characters a location.residents -->
            <ul class="list-group" th:if="${location.residents != null}">
                <li class="list-group-item" th:each="character : ${location.residents}">
                    <a th:href="@{/characters/{id}(id=${character.id})}" th:text="${character.name}"></a>
                    <span class="label label-default" th:text="${character.species}"></span>
                    <span class="label label-info" th:text="${character.status}"></span>
                </li>
            </ul>


            <!-- Cambiado de location.characters a location.residents -->
            <div th:if="${location.residents == null or #lists.isEmpty(location.residents)}" class="panel-body">
                <em>No characters available.</em>
            </div>
        </div>


    </div>
    <a href="/locations" class="btn btn-default">Back</a>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
